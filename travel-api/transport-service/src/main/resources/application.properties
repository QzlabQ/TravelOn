spring.application.name=transport-service

server.port=0

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery:8010/eureka}

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

spring.rabbitmq.host=rabbitmq

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/transport_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
app.seed-data.base-path=${APP_SEED_DATA_BASE_PATH:file:../seed-data/transport/}
app.seed-data.common-base-path=${APP_SEED_DATA_COMMON_BASE_PATH:file:../seed-data/common/}
app.seed-data.train-base-path=${APP_SEED_DATA_TRAIN_BASE_PATH:${app.seed-data.base-path}train/}
app.seed-data.plane-base-path=${APP_SEED_DATA_PLANE_BASE_PATH:${app.seed-data.base-path}plane/}
app.tour-products.enabled=${APP_TOUR_PRODUCTS_ENABLED:false}
