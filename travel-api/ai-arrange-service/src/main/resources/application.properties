spring.application.name=ai-arrange-service

server.port=${AI_ARRANGE_SERVICE_PORT:8082}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://${MONGO_HOST:localhost}:27017/ai-arrange-db}

ai.arrange.ai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.arrange.ai.chat-completions-path=${DEEPSEEK_CHAT_COMPLETIONS_PATH:/chat/completions}
ai.arrange.ai.api-key=${DEEPSEEK_API_KEY:}
ai.arrange.ai.model=${DEEPSEEK_MODEL:deepseek-v4-pro}
ai.arrange.ai.temperature=${DEEPSEEK_TEMPERATURE:0.6}
ai.arrange.ai.timeout-seconds=${DEEPSEEK_TIMEOUT_SECONDS:90}

ai.arrange.agent.base-url=${AI_ARRANGE_AGENT_BASE_URL:http://localhost:8090}
ai.arrange.agent.timeout-seconds=${AI_ARRANGE_AGENT_TIMEOUT_SECONDS:150}

ai.arrange.cors.allowed-origins=${AI_ARRANGE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

ai.arrange.amap.base-url=${AMAP_BASE_URL:https://restapi.amap.com/v3}
ai.arrange.amap.api-key=${AMAP_API_KEY:}
ai.arrange.amap.enabled=${AMAP_ENABLED:true}

logging.level.org.springframework.web.socket=INFO
