name: nullptr-ai-travel

services:
  mongo:
    image: mongo:7
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    networks:
      - backend

  ai-arrange-agent:
    build: ./ai-arrange-agent-service
    env_file:
      - .env
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      DEEPSEEK_TIMEOUT_SECONDS: "180"
      DEEPSEEK_THINKING_TYPE: "disabled"
      AGENT_MODEL_TIMEOUT_SECONDS: "180"
      AGENT_MAX_RUNTIME_SECONDS: "240"
      DEEPSEEK_MAX_TOKENS: "12000"
      DEEPSEEK_SLOW_RESPONSE_WARNING_MS: "60000"
      NO_PROXY: "localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,mongo"
      no_proxy: "localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,mongo"
    ports:
      - "8090:8090"
    networks:
      - backend

  ai-arrange:
    build: ./ai-arrange-service
    env_file:
      - .env
    volumes:
      - ./logs/ai-arrange:/logs
    environment:
      MONGO_HOST: mongo
      AI_ARRANGE_AGENT_BASE_URL: http://ai-arrange-agent:8090
      AI_ARRANGE_AGENT_TIMEOUT_SECONDS: "270"
      AI_ARRANGE_SERVICE_PORT: "8082"
      AI_ARRANGE_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,mongo"
      no_proxy: "localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,mongo"
    depends_on:
      - mongo
      - ai-arrange-agent
    ports:
      - "8082:8082"
    networks:
      - backend

  front:
    build: ../travel-ui
    depends_on:
      - ai-arrange
    ports:
      - "3000:80"
    networks:
      - backend

networks:
  backend:
