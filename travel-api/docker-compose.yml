# version: "3.9"
name: rsww_184249

services:
  postgres:
    image: postgres:16
    hostname: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: travel_admin
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-55672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-55673}:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq #here hardcoded path to store rabbitmq data, change it to your local path
      - ./logs/rabbitmq:/var/log/rabbitmq
    networks:
      - backend

  mongo:
    image: mongo:7
    hostname: mongo
    ports:
      - "${MONGO_HOST_PORT:-57017}:27017"
    volumes:
      - ./data/mongo:/data/db
    networks:
      - backend

  discovery:
    hostname: discovery
    build: ./discovery-service
    ports:
      - "${DISCOVERY_HOST_PORT:-58010}:8010"
    volumes:
      - ./logs/discovery:/logs
    depends_on:
      - rabbitmq
    networks:
      - backend

  gateway:
    build: ./api-gateway
    ports:
      - "${GATEWAY_HOST_PORT:-58082}:8082"
    volumes:
      - ./logs/gateway:/logs
    depends_on:
      - rabbitmq
      - discovery
    networks:
      - backend

  # custom services
  hotel:
    build: ./hotel-service
    volumes:
      - ./logs/hotel:/logs
      - ./seed-data/hotel:/seed-data/hotel:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      APP_SEED_DATA_BASE_PATH: file:/seed-data/hotel/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  offer-provider:
    build: ./offer-provider-service
    volumes:
      - ./logs/offer-provider:/logs
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  payment:
    build: ./payment-service
    volumes:
      - ./logs/payment:/logs
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  reservation:
    build: ./reservation-service
    volumes:
      - ./logs/reservation:/logs
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservation_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  transport:
    build: ./transport-service
    volumes:
      - ./logs/transport:/logs
      - ./seed-data/transport:/seed-data/transport:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transport_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      APP_SEED_DATA_BASE_PATH: file:/seed-data/transport/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  user:
    build: ./user-service
    volumes:
      - ./logs/user:/logs
      - ./seed-data/user:/seed-data/user:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      APP_SEED_DATA_BASE_PATH: file:/seed-data/user/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  community:
    build: ./community-service
    volumes:
      - ./logs/community:/logs
      - ./seed-data/hotel:/seed-data/hotel:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/community_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      APP_SEED_DATA_HOTEL_REVIEWS_CSV: file:/seed-data/hotel/hotel_reviews.csv
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
      gateway:
        condition: service_started
      user:
        condition: service_started
    networks:
      - backend

  data-generator:
    build: ./data-generator
    profiles:
      - simulator
    volumes:
      - ./logs/data-generator:/logs
      - ./seed-data/hotel:/seed-data/hotel:ro
    environment:
      APP_SEED_DATA_BASE_PATH: file:/seed-data/hotel/
    depends_on:
      - rabbitmq
      - discovery
      - gateway
      - hotel
      - transport
    networks:
      - backend

  ai-arrange-agent:
    build: ./ai-arrange-agent-service
    env_file:
      - .env
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      DEEPSEEK_TIMEOUT_SECONDS: "180"
      AGENT_MODEL_TIMEOUT_SECONDS: "180"
      AGENT_MAX_RUNTIME_SECONDS: "240"
      DEEPSEEK_MAX_TOKENS: "10000"
      NO_PROXY: "localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,gateway,discovery,mongo,rabbitmq"
      no_proxy: "localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,gateway,discovery,mongo,rabbitmq"
    ports:
      - "${AI_ARRANGE_AGENT_HOST_PORT:-58090}:8090"
    networks:
      - backend

  ai-arrange:
    build: ./ai-arrange-service
    env_file:
      - .env
    volumes:
      - ./logs/ai-arrange:/logs
    environment:
      - MONGO_HOST=mongo
      - RABBITMQ_HOST=rabbitmq
      - AI_AGENT_ENABLED=true
      - AI_ARRANGE_AGENT_BASE_URL=http://ai-arrange-agent:8090
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - ALL_PROXY=
      - all_proxy=
      - NO_PROXY=localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,gateway,discovery,mongo,rabbitmq
      - no_proxy=localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,gateway,discovery,mongo,rabbitmq
    depends_on:
      - rabbitmq
      - mongo
      - discovery
      - gateway
    networks:
      - backend

networks:
  backend:
