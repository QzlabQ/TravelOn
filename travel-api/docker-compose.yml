# version: "3.9"
name: rsww_184249

services:
  postgres:
    image: postgres:16
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-travel_admin}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./database:/database:ro
      - ./seed-data:/seed-data:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(head -n 1 \"$${PGDATA}/postmaster.pid\" 2>/dev/null)\" = \"1\" && pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      # First boot replays the schema + ~300k seed rows before the real server
      # (pid 1) starts, so the healthcheck necessarily fails until init finishes.
      # start_period keeps those early failures from marking postgres unhealthy
      # and tearing down dependent services on a fresh-volume build. Sized
      # generously for low-spec deploy machines: a faster host turns healthy as
      # soon as the first check passes, so a large value costs nothing there.
      start_period: 1200s
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-55672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-55673}:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq #here hardcoded path to store rabbitmq data, change it to your local path
      - ./logs/rabbitmq:/var/log/rabbitmq
    networks:
      - backend

  mongo:
    image: mongo:7
    hostname: mongo
    ports:
      - "${MONGO_HOST_PORT:-57017}:27017"
    volumes:
      - ./data/mongo:/data/db
    networks:
      - backend

  discovery:
    hostname: discovery
    build: ./discovery-service
    ports:
      - "${DISCOVERY_HOST_PORT:-58010}:8010"
    volumes:
      - ./logs/discovery:/logs
    depends_on:
      - rabbitmq
    networks:
      - backend

  gateway:
    build: ./api-gateway
    ports:
      - "${GATEWAY_HOST_PORT:-58082}:8082"
    volumes:
      - ./logs/gateway:/logs
    depends_on:
      - rabbitmq
      - discovery
    networks:
      - backend

  # custom services
  hotel:
    build: ./hotel-service
    volumes:
      - ./logs/hotel:/logs
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${HOTEL_DB_NAME:-hotel_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  offer-provider:
    build: ./offer-provider-service
    volumes:
      - ./logs/offer-provider:/logs
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  payment:
    build: ./payment-service
    volumes:
      - ./logs/payment:/logs
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PAYMENT_DB_NAME:-payment_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  reservation:
    build: ./reservation-service
    volumes:
      - ./logs/reservation:/logs
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${RESERVATION_DB_NAME:-reservation_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      APP_PAYMENT_TIMEOUT_SECONDS: ${APP_PAYMENT_TIMEOUT_SECONDS:-1800}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  transport:
    build: ./transport-service
    volumes:
      - ./logs/transport:/logs
      # Runtime dependency: CityCatalog reads common/cities.csv for city lookups.
      - ./seed-data/common:/seed-data/common:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${TRANSPORT_DB_NAME:-transport_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      APP_SEED_DATA_COMMON_BASE_PATH: file:/seed-data/common/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  user:
    build: ./user-service
    volumes:
      - ./logs/user:/logs
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${USER_DB_NAME:-user_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - backend

  community:
    build: ./community-service
    volumes:
      - ./logs/community:/logs
      - ./data/community/uploads:/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${COMMUNITY_DB_NAME:-community_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      APP_UPLOADS_DIR: /uploads
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
      gateway:
        condition: service_started
      user:
        condition: service_started
    networks:
      - backend

  ai-arrange-agent:
    build: ./ai-arrange-agent-service
    env_file:
      - .env
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      DEEPSEEK_TIMEOUT_SECONDS: "180"
      DEEPSEEK_THINKING_TYPE: "disabled"
      AGENT_MODEL_TIMEOUT_SECONDS: "180"
      AGENT_MAX_RUNTIME_SECONDS: "240"
      DEEPSEEK_MAX_TOKENS: "${DEEPSEEK_MAX_TOKENS:-12000}"
      DEEPSEEK_SLOW_RESPONSE_WARNING_MS: "60000"
      TRAVEL_GATEWAY_BASE_URL: "http://gateway:8082"
      NO_PROXY: "localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,gateway,discovery,mongo,rabbitmq"
      no_proxy: "localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,gateway,discovery,mongo,rabbitmq"
    expose:
      - "8090"
    networks:
      - backend

  ai-arrange:
    build: ./ai-arrange-service
    env_file:
      - .env
    volumes:
      - ./logs/ai-arrange:/logs
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - RABBITMQ_HOST=rabbitmq
      - MONGODB_URI=mongodb://mongo:27017/ai-arrange-db
      - AI_AGENT_ENABLED=true
      - AI_ARRANGE_AGENT_BASE_URL=http://ai-arrange-agent:8090
      - AI_ARRANGE_AGENT_TIMEOUT_SECONDS=270
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - ALL_PROXY=
      - all_proxy=
      - NO_PROXY=localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,gateway,discovery,mongo,rabbitmq
      - no_proxy=localhost,127.0.0.1,::1,ai-arrange-agent,ai-arrange,gateway,discovery,mongo,rabbitmq
    depends_on:
      - rabbitmq
      - mongo
      - discovery
      - gateway
    networks:
      - backend

networks:
  backend:
