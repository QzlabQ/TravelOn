spring.application.name=community-service

server.port=0

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery:8010/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:5}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_DURATION_SECONDS:15}
eureka.client.should-unregister-on-shutdown=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/community_db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# Local storage for user-uploaded community images, served under /community/uploads/**
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=${APP_UPLOADS_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_UPLOADS_MAX_REQUEST_SIZE:12MB}

# Flyway manages schema migrations. On an existing (init-provisioned) database it
# adopts the current schema as the V1 baseline; new schema changes go in
# src/main/resources/db/migration as V2__*.sql, V3__*.sql, ... and are applied
# incrementally without wiping data. Hibernate then only validates.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
