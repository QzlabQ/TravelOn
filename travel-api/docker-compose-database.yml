# version: "3.9"
name: mcarchvsc

x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  db:
    <<: *service-defaults
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-database}
      PGDATA: /data/postgres
    volumes:
      - ./data/postgres:/data/postgres
    ports:
      - "${DATABASE_POSTGRES_HOST_PORT:-55433}:5432"
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  userdb:
    <<: *service-defaults
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - POSTGRES_DB=${USERDB_DB_NAME:-users}
      - PGDATA=/data/postgres
    expose:
      - "5432"
    restart: unless-stopped
    volumes:
      - ./data/userdb:/data/postgres
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  backend:
    name: mcarchvsc_backend
    external: true
