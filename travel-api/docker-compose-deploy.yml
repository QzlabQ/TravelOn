version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "${DEPLOY_RABBITMQ_HOST_PORT:-59672}:5672"
      - "${DEPLOY_RABBITMQ_MANAGEMENT_HOST_PORT:-59673}:15672"
    volumes:
      - E:/2026spring/26NULLptr/repositories/travel-api/data/rabbitmq-deploy:/var/lib/rabbitmq
      - E:/2026spring/26NULLptr/repositories/travel-api/logs/rabbitmq-deploy:/var/log/rabbitmq
    networks:
      - backend

  mongo:
    image: mongo:7
    hostname: mongo
    ports:
      - "${DEPLOY_MONGO_HOST_PORT:-59017}:27017"
    volumes:
      - E:/2026spring/26NULLptr/repositories/travel-api/data/mongo-deploy:/data/db
    networks:
      - backend

  front:
    image: ghcr.io/microarchitecturovisco/travel-ui:dev
    hostname: front
    ports:
      - "${DEPLOY_FRONT_HOST_PORT:-59080}:80"
    depends_on:
      - rabbitmq
      - discovery
    networks:
      - backend
    deploy:
      replicas: 1

  discovery:
    image: ghcr.io/microarchitecturovisco/discovery:dev
    hostname: discovery
    ports:
      - "${DEPLOY_DISCOVERY_HOST_PORT:-59010}:8010"
    depends_on:
      - rabbitmq
    networks:
      - backend

  gateway:
    image: ghcr.io/microarchitecturovisco/gateway:dev
    ports:
      - "${DEPLOY_GATEWAY_HOST_PORT:-59082}:8082"
    depends_on:
      - rabbitmq
      - discovery
    networks:
      - backend

  hotel:
    image: ghcr.io/microarchitecturovisco/hotel:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend
    deploy:
      replicas: 2

  offer-provider:
    image: ghcr.io/microarchitecturovisco/offer-provider:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend
    deploy:
      replicas: 2

  payment:
    image: ghcr.io/microarchitecturovisco/payment:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  reservation:
    image: ghcr.io/microarchitecturovisco/reservation:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  transport:
    image: ghcr.io/microarchitecturovisco/transport:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend
    deploy:
      replicas: 2

  user:
    image: ghcr.io/microarchitecturovisco/user:latest
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  data-generator:
    image: ghcr.io/microarchitecturovisco/data-generator:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
      - hotel
      - transport
    networks:
      - backend

  ai-arrange:
    image: ghcr.io/microarchitecturovisco/ai-arrange:dev
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - mongo
      - discovery
      - gateway
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGODB_URI=mongodb://mongo:27017/ai-arrange-db
      - RABBITMQ_HOST=rabbitmq
    networks:
      - backend

networks:
  backend:
