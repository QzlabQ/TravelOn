version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "18424:5672"
      - "18446:15672"
    volumes:
      - E:/2026spring/26NULLptr/repositories/travel-api/data/rabbitmq-deploy:/var/lib/rabbitmq
      - E:/2026spring/26NULLptr/repositories/travel-api/logs/rabbitmq-deploy:/var/log/rabbitmq
    networks:
      - backend

  mongo:
    image: mongo:7
    hostname: mongo
    ports:
      - "18470:27017"
    volumes:
      - E:/2026spring/26NULLptr/repositories/travel-api/data/mongo-deploy:/data/db
    networks:
      - backend

  front:
    image: ghcr.io/microarchitecturovisco/travel-ui:dev
    hostname: front
    ports:
      - "18453:80"
    depends_on:
      - rabbitmq
      - discovery
    networks:
      - backend
    deploy:
      replicas: 1

  discovery:
    image: ghcr.io/microarchitecturovisco/discovery:dev
    hostname: discovery
    ports:
      - "18451:8010"
    depends_on:
      - rabbitmq
    networks:
      - backend

  gateway:
    image: ghcr.io/microarchitecturovisco/gateway:dev
    ports:
      - "18469:8082"
    depends_on:
      - rabbitmq
      - discovery
    networks:
      - backend

  hotel:
    image: ghcr.io/microarchitecturovisco/hotel:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend
    deploy:
      replicas: 2

  offer-provider:
    image: ghcr.io/microarchitecturovisco/offer-provider:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend
    deploy:
      replicas: 2

  payment:
    image: ghcr.io/microarchitecturovisco/payment:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  reservation:
    image: ghcr.io/microarchitecturovisco/reservation:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  transport:
    image: ghcr.io/microarchitecturovisco/transport:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend
    deploy:
      replicas: 2

  user:
    image: ghcr.io/microarchitecturovisco/user:latest
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  data-generator:
    image: ghcr.io/microarchitecturovisco/data-generator:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
      - hotel
      - transport
    networks:
      - backend

  ai-arrange:
    image: ghcr.io/microarchitecturovisco/ai-arrange:dev
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - mongo
      - discovery
      - gateway
    environment:
      - MONGO_HOST=mongo
      - RABBITMQ_HOST=rabbitmq
    networks:
      - backend

networks:
  backend:
