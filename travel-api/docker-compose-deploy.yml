x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "${DEPLOY_RABBITMQ_HOST_PORT:-59672}:5672"
      - "${DEPLOY_RABBITMQ_MANAGEMENT_HOST_PORT:-59673}:15672"
    volumes:
      - ./data/rabbitmq-deploy:/var/lib/rabbitmq
      - ./logs/rabbitmq-deploy:/var/log/rabbitmq
    networks:
      - backend

  mongo:
    <<: *service-defaults
    image: mongo:7
    hostname: mongo
    ports:
      - "${DEPLOY_MONGO_HOST_PORT:-59017}:27017"
    volumes:
      - ./data/mongo-deploy:/data/db
    networks:
      - backend

  front:
    <<: *service-defaults
    image: ghcr.io/microarchitecturovisco/travel-ui:dev
    hostname: front
    ports:
      - "${DEPLOY_FRONT_HOST_PORT:-59080}:80"
    depends_on:
      - rabbitmq
      - discovery
    networks:
      - backend
    deploy:
      replicas: 1

  discovery:
    <<: *service-defaults
    image: ghcr.io/microarchitecturovisco/discovery:dev
    hostname: discovery
    ports:
      - "${DEPLOY_DISCOVERY_HOST_PORT:-59010}:8010"
    depends_on:
      - rabbitmq
    networks:
      - backend

  gateway:
    <<: *service-defaults
    image: ghcr.io/microarchitecturovisco/gateway:dev
    ports:
      - "${DEPLOY_GATEWAY_HOST_PORT:-59082}:8082"
    depends_on:
      - rabbitmq
      - discovery
    networks:
      - backend

  hotel:
    <<: *service-defaults
    image: ghcr.io/microarchitecturovisco/hotel:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend
    deploy:
      replicas: 2

  order:
    <<: *service-defaults
    image: ghcr.io/microarchitecturovisco/order:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  transport:
    <<: *service-defaults
    image: ghcr.io/microarchitecturovisco/transport:dev
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend
    deploy:
      replicas: 2

  user:
    <<: *service-defaults
    image: ghcr.io/microarchitecturovisco/user:latest
    depends_on:
      - rabbitmq
      - discovery
      - gateway
    networks:
      - backend

  ai-arrange:
    <<: *service-defaults
    image: ghcr.io/microarchitecturovisco/ai-arrange:dev
    env_file:
      - path: .env
        required: false
    depends_on:
      - rabbitmq
      - mongo
      - discovery
      - gateway
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGODB_URI=mongodb://mongo:27017/ai-arrange-db
      - RABBITMQ_HOST=rabbitmq
    networks:
      - backend

networks:
  backend:
