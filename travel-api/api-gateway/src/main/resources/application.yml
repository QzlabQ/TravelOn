server:
  port: ${SERVER_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://discovery:8010/eureka}
  instance:
    prefer-ip-address: true


logging:
  level:
    org:
      springframework:
        cloud:
          gateway: TRACE
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - '*'
            allowed-origin-patterns:
              - '*'
            allowed-headers:
              - '*'
            exposed-headers:
              - '*'
            allowed-methods:
              - '*'
          '/**':
            allowed-origin-patterns:
              - '*'
            allowed-origins:
              - '*'
            allowed-headers:
              - '*'
            allowed-methods:
              - '*'
        add-to-simple-url-handler-mapping: true
      routes:
        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/hotels/**
          filters:
            - RemoveRequestHeader=Cookie
        - id: transport-service
          uri: lb://transport-service
          predicates:
            - Path=/transports/**
          filters:
            - RemoveRequestHeader=Cookie
        - id: offer-provider-service
          uri: lb://offer-provider-service
          predicates:
            - Path=/offers/**
          filters:
            - RemoveRequestHeader=Cookie
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
          filters:
            - RemoveRequestHeader=Cookie
        - id: community-service
          uri: lb://community-service
          predicates:
            - Path=/community/**
          filters:
            - RemoveRequestHeader=Cookie
        - id: reservation-service
          uri: lb://reservation-service
          predicates:
            - Path=/reservations/**
          metadata:
            cors:
              allowedOrigins: '*'
              allowedMethods: '*'
              allowedHeaders: '*'
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - RemoveRequestHeader=Cookie
        - id: ai-arrange-websocket
          uri: lb:ws://ai-arrange-service
          predicates:
            - Path=/ai-arrange/ws/**
          filters:
            - RemoveRequestHeader=Cookie
        - id: ai-arrange-service
          uri: lb://ai-arrange-service
          predicates:
            - Path=/ai-arrange/**
          filters:
            - RemoveRequestHeader=Cookie
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
