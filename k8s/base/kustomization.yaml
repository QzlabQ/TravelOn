apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelon
resources:
  - namespace.yaml
  - config.yaml
  - data.yaml
  - apps.yaml
# These labels identify objects whose lifecycle is owned by the repository CD
# pipeline.  Do not include selectors: adding a new selector label to an
# existing Deployment/StatefulSet would be an immutable-field change.
labels:
  - pairs:
      app.kubernetes.io/part-of: travelon
      app.kubernetes.io/managed-by: travelon-cd
    includeSelectors: false
    includeTemplates: true
images:
  - name: travelon-postgres
    newName: ghcr.io/qzlabq/travelon-postgres
    newTag: latest
  - name: travelon-discovery
    newName: ghcr.io/qzlabq/travelon-discovery
    newTag: latest
  - name: travelon-gateway
    newName: ghcr.io/qzlabq/travelon-gateway
    newTag: latest
  - name: travelon-travel-core
    newName: ghcr.io/qzlabq/travelon-travel-core
    newTag: latest
  - name: travelon-user
    newName: ghcr.io/qzlabq/travelon-user
    newTag: latest
  - name: travelon-community
    newName: ghcr.io/qzlabq/travelon-community
    newTag: latest
  - name: travelon-order
    newName: ghcr.io/qzlabq/travelon-order
    newTag: latest
  - name: travelon-ai-arrange
    newName: ghcr.io/qzlabq/travelon-ai-arrange
    newTag: latest
  - name: travelon-ai-arrange-agent
    newName: ghcr.io/qzlabq/travelon-ai-arrange-agent
    newTag: latest
  - name: travelon-ui
    newName: ghcr.io/qzlabq/travelon-ui
    newTag: latest
