apiVersion: v1
kind: ConfigMap
metadata:
  name: travelon-config
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: travelon
  POSTGRES_DB: travel_admin
  RABBITMQ_HOST: rabbitmq
  MONGO_HOST: mongo
  MONGO_PORT: "27017"
  EUREKA_DEFAULT_ZONE: http://discovery:8010/eureka
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
