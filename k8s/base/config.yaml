apiVersion: v1
kind: ConfigMap
metadata:
  name: travelon-config
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: travelon
  POSTGRES_DB: travel_admin
  RABBITMQ_HOST: rabbitmq
  MONGO_HOST: mongo
  MONGO_PORT: "27017"
  EUREKA_DEFAULT_ZONE: http://discovery:8010/eureka
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  AI_BASE_URL: https://api.deepseek.com
  AI_CHAT_COMPLETIONS_PATH: /chat/completions
  AI_MODEL: deepseek-v4-pro
  AI_JSON_MODE: "true"
  AI_THINKING_TYPE: omit
  AI_TEMPERATURE: "0.6"
  AI_MAX_TOKENS: "12000"
  AI_MODEL_TIMEOUT_SECONDS: "180"
  AI_SLOW_RESPONSE_WARNING_MS: "60000"
  AGENT_MODEL_TIMEOUT_SECONDS: "180"
  AGENT_MAX_RUNTIME_SECONDS: "240"
