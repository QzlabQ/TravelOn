apiVersion: v1
kind: Service
metadata: {name: ai-arrange-agent}
spec: {selector: {app: ai-arrange-agent}, ports: [{name: http, port: 8090, targetPort: 8090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-arrange-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: ai-arrange-agent}}
  template:
    metadata: {labels: {app: ai-arrange-agent}}
    spec:
      containers:
        - name: ai-arrange-agent
          image: travelon-ai-arrange-agent
          ports: [{containerPort: 8090}]
          env:
            - {name: AI_BASE_URL, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_BASE_URL}}}
            - {name: AI_CHAT_COMPLETIONS_PATH, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_CHAT_COMPLETIONS_PATH}}}
            - {name: AI_API_KEY, valueFrom: {secretKeyRef: {name: travelon-secrets, key: AI_API_KEY, optional: true}}}
            - {name: AI_MODEL, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_MODEL}}}
            - {name: AI_JSON_MODE, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_JSON_MODE}}}
            - {name: AI_THINKING_TYPE, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_THINKING_TYPE}}}
            - {name: AI_TEMPERATURE, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_TEMPERATURE}}}
            - {name: AI_MAX_TOKENS, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_MAX_TOKENS}}}
            - {name: AI_MODEL_TIMEOUT_SECONDS, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_MODEL_TIMEOUT_SECONDS}}}
            - {name: AI_SLOW_RESPONSE_WARNING_MS, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_SLOW_RESPONSE_WARNING_MS}}}
            - {name: AGENT_MODEL_TIMEOUT_SECONDS, valueFrom: {configMapKeyRef: {name: travelon-config, key: AGENT_MODEL_TIMEOUT_SECONDS}}}
            - {name: AGENT_MAX_RUNTIME_SECONDS, valueFrom: {configMapKeyRef: {name: travelon-config, key: AGENT_MAX_RUNTIME_SECONDS}}}
            - {name: DEEPSEEK_API_KEY, valueFrom: {secretKeyRef: {name: travelon-secrets, key: DEEPSEEK_API_KEY, optional: true}}}
            - {name: AMAP_API_KEY, valueFrom: {secretKeyRef: {name: travelon-secrets, key: AMAP_API_KEY, optional: true}}}
            - {name: TRAVEL_GATEWAY_BASE_URL, value: "http://gateway:8082"}
          startupProbe: {httpGet: {path: /agent/health, port: 8090}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /agent/health, port: 8090}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /agent/health, port: 8090}, periodSeconds: 30}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: ai-arrange}
spec: {selector: {app: ai-arrange}, ports: [{name: http, port: 8087, targetPort: 8087}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-arrange}
spec:
  replicas: 1
  selector: {matchLabels: {app: ai-arrange}}
  template:
    metadata: {labels: {app: ai-arrange}}
    spec:
      containers:
        - name: ai-arrange
          image: travelon-ai-arrange
          ports: [{containerPort: 8087}]
          envFrom: [{configMapRef: {name: travelon-config}}]
          env:
            - {name: SERVER_PORT, value: "8087"}
            - {name: MONGODB_URI, value: "mongodb://mongo:27017/ai-arrange-db"}
            - {name: AI_AGENT_ENABLED, value: "true"}
            - {name: AI_ARRANGE_AGENT_BASE_URL, value: "http://ai-arrange-agent:8090"}
            - {name: AI_ARRANGE_AGENT_TIMEOUT_SECONDS, value: "270"}
            - {name: AI_BASE_URL, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_BASE_URL}}}
            - {name: AI_CHAT_COMPLETIONS_PATH, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_CHAT_COMPLETIONS_PATH}}}
            - {name: AI_API_KEY, valueFrom: {secretKeyRef: {name: travelon-secrets, key: AI_API_KEY, optional: true}}}
            - {name: AI_MODEL, valueFrom: {configMapKeyRef: {name: travelon-config, key: AI_MODEL}}}
            - {name: DEEPSEEK_API_KEY, valueFrom: {secretKeyRef: {name: travelon-secrets, key: DEEPSEEK_API_KEY, optional: true}}}
            - {name: AMAP_API_KEY, valueFrom: {secretKeyRef: {name: travelon-secrets, key: AMAP_API_KEY, optional: true}}}
          startupProbe: {tcpSocket: {port: 8087}, failureThreshold: 60, periodSeconds: 10}
          readinessProbe: {tcpSocket: {port: 8087}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8087}, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: travelon-ui}
spec: {selector: {app: travelon-ui}, ports: [{name: http, port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: travelon-ui}
spec:
  replicas: 1
  selector: {matchLabels: {app: travelon-ui}}
  template:
    metadata: {labels: {app: travelon-ui}}
    spec:
      containers:
        - name: travelon-ui
          image: travelon-ui
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 15}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelon
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: travelon-ui, port: {number: 80}}}
