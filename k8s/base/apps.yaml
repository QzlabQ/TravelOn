apiVersion: v1
kind: Service
metadata: {name: community}
spec: {selector: {app: community}, ports: [{name: http, port: 8088, targetPort: 8088}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: community}
spec:
  replicas: 1
  selector: {matchLabels: {app: community}}
  template:
    metadata: {labels: {app: community}}
    spec:
      containers:
        - name: community
          image: travelon-community
          ports: [{containerPort: 8088}]
          envFrom: [{configMapRef: {name: travelon-config}}]
          env:
            - {name: SERVER_PORT, value: "8088"}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/community_db"}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {configMapKeyRef: {name: travelon-config, key: POSTGRES_USER}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: travelon-secrets, key: POSTGRES_PASSWORD}}}
            - {name: APP_UPLOADS_DIR, value: /uploads}
            - {name: SPRING_RABBITMQ_HOST, value: rabbitmq}
          startupProbe: {tcpSocket: {port: 8088}, failureThreshold: 120, periodSeconds: 10}
          readinessProbe: {tcpSocket: {port: 8088}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8088}, periodSeconds: 15}
          volumeMounts: [{name: uploads, mountPath: /uploads}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
      volumes: [{name: uploads, persistentVolumeClaim: {claimName: community-uploads}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: community-uploads}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: order}
