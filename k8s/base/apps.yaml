apiVersion: v1
kind: Service
metadata: {name: discovery}
spec:
  selector: {app: discovery}
  ports: [{name: http, port: 8010, targetPort: 8010}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: discovery}
spec:
  replicas: 1
  selector: {matchLabels: {app: discovery}}
  template:
    metadata: {labels: {app: discovery}}
    spec:
      containers:
        - name: discovery
          image: travelon-discovery
          ports: [{containerPort: 8010}]
          readinessProbe: {httpGet: {path: /, port: 8010}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8010}, initialDelaySeconds: 30, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 768Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{name: http, port: 8082, targetPort: 8082}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: travelon-gateway
          ports: [{containerPort: 8082}]
          envFrom: [{configMapRef: {name: travelon-config}}]
          startupProbe: {tcpSocket: {port: 8082}, failureThreshold: 60, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: 8082}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8082}, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 768Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: travel-core}
spec: {selector: {app: travel-core}, ports: [{name: http, port: 8083, targetPort: 8083}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: travel-core}
spec:
  replicas: 1
  selector: {matchLabels: {app: travel-core}}
  template:
    metadata: {labels: {app: travel-core}}
    spec:
      initContainers:
        - name: travel-core-migration
          image: travelon-postgres
          command: ["/bin/bash", "/database/migration/migrate-existing-databases.sh"]
          env:
            - {name: POSTGRES_USER, valueFrom: {configMapKeyRef: {name: travelon-config, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: travelon-secrets, key: POSTGRES_PASSWORD}}}
            - {name: HOTEL_DB_NAME, value: "hotel_db"}
            - {name: TRANSPORT_DB_NAME, value: "transport_db"}
            - {name: TRAVEL_CORE_DB_NAME, value: "travel_core_db"}
            - {name: PGHOST, value: "postgres"}
            - {name: PGPORT, value: "5432"}
      containers:
        - name: travel-core
          image: travelon-travel-core
          ports: [{containerPort: 8083}]
          envFrom: [{configMapRef: {name: travelon-config}}]
          env:
            - {name: SERVER_PORT, value: "8083"}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/travel_core_db"}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {configMapKeyRef: {name: travelon-config, key: POSTGRES_USER}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: travelon-secrets, key: POSTGRES_PASSWORD}}}
            - {name: APP_SEED_DATA_COMMON_BASE_PATH, value: "file:/seed-data/common/"}
          startupProbe: {tcpSocket: {port: 8083}, failureThreshold: 120, periodSeconds: 10}
          readinessProbe: {tcpSocket: {port: 8083}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8083}, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
---
