name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: mise run setup

      - name: Compile applications
        shell: bash
        run: |
          set -euo pipefail

          for pom in travel-api/*/pom.xml; do
            module="${pom%/pom.xml}"
            echo "::group::Compile ${module##*/}"
            (
              cd "$module"
              sh ./mvnw --batch-mode --no-transfer-progress -DskipTests package
            )
            echo "::endgroup::"
          done

          python -m compileall -q travel-api/ai-arrange-agent-service/app

          cd travel-ui
          corepack yarn build

      - name: Run unit tests
        run: mise run test:unit

      - name: Prepare integration environment
        shell: bash
        run: touch travel-api/.env

      - name: Run integration tests
        run: mise run test:integration

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 14
