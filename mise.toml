# TravelOn 统一开发/测试工具链
# 用法：安装 mise 后在仓库根目录执行 `mise install`，再用 `mise run test:unit` 等任务。
# 版本口径与 tests/run_tests.py 的 preflight 校验保持一致，改这里请同步改那里。

[tools]
# tests/run_tests.py 要求 java -version 主版本号为 21
java = "temurin-21"
# 前端锁定 22.22.3（精确匹配，preflight 会逐字比对）
node = "22.22.3"
# 测试编排脚本要求 Python 3.12（注意：agent-service 运行镜像用的是 3.13，仅测试链固定 3.12）
python = "3.12"

[env]
# corepack 首次拉取 Yarn 4.2.2 时不要弹交互确认，否则任务会卡住
COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
# 进入仓库即激活 .venv（不存在时自动创建），保证 pytest/httpx 来自同一环境
_.python.venv = { path = ".venv", create = true, python = "3.12" }

[tasks."setup:py"]
description = "安装 Python 测试依赖到 .venv"
run = "python -m pip install --upgrade pip && python -m pip install -r tests/requirements.txt"

[tasks."setup:ui"]
description = "安装前端依赖（Yarn 4.2.2 via corepack）"
dir = "travel-ui"
run = "corepack yarn install --immutable"

[tasks."setup:e2e"]
description = "安装 Playwright chromium 浏览器"
dir = "travel-ui"
depends = ["setup:ui"]
run = "corepack yarn playwright install chromium"

[tasks.setup]
description = "一次性准备 Python 与前端依赖"
depends = ["setup:py", "setup:ui"]

[tasks."ui:dev"]
description = "启动前端开发服务器"
dir = "travel-ui"
# 交互式长运行任务需要直连终端。用 Node shebang 让 mise 直接启动
# React Scripts，避免 Windows 上默认的 `cmd /c` 再嵌套 `corepack.cmd`；否则
# Ctrl+C 会触发 `Terminate batch job (Y/N)?` 并与 PowerShell 争抢输入。
raw = true
run = '''
#!/usr/bin/env node
process.argv.splice(2, 0, "start");
require(require.resolve("react-scripts/bin/react-scripts.js", {paths: [process.cwd()]}));
'''

[tasks."ui:build"]
description = "构建前端生产产物"
dir = "travel-ui"
run = "corepack yarn build"

[tasks."ui:serve"]
description = "预览前端生产产物"
dir = "travel-ui"
run = "corepack yarn serve"

[tasks.build]
description = "构建全部 Java、Python 和前端应用"
run = "python scripts/build_all.py"

[tasks."services:up"]
description = "使用已有镜像启动后端服务"
dir = "travel-api"
run = "docker compose up -d"

[tasks."services:up_build"]
description = "构建并启动后端服务"
dir = "travel-api"
run = "docker compose up -d --build"

[tasks."services:status"]
description = "查看后端服务状态"
dir = "travel-api"
run = "docker compose ps"

[tasks."services:stop"]
description = "停止后端服务并保留容器"
dir = "travel-api"
run = "docker compose stop"

[tasks."services:down"]
description = "停止并删除后端服务容器"
dir = "travel-api"
run = "docker compose down"

[tasks."test:pre"]
description = "前置守卫（种子数据、迁移脚本、资源与配置）"
run = "python tests/run_tests.py pre"

[tasks."test:unit"]
description = "单元测试（Java + Python + 前端）"
run = "python tests/run_tests.py unit"

[tasks."test:migration"]
description = "PostgreSQL 旧数据库迁移回归测试"
run = "python tests/run_tests.py migration"

[tasks."test:integration"]
description = "集成测试（需要 Docker Compose 栈）"
run = "python tests/run_tests.py integration --manage-services"

[tasks."test:e2e"]
description = "端到端测试（Playwright chromium）"
depends = ["setup:e2e"]
run = "python tests/run_tests.py e2e --manage-services --browser chromium"

[tasks."test:ci"]
description = "运行与 CI 相同的测试阶段"
depends = ["setup:e2e"]
run = "python tests/run_tests.py ci --manage-services"

[tasks."deploy:images"]
description = "验证全部部署镜像可构建；需追加镜像标签"
run = "bash scripts/verify-k3s-images.sh"

[tasks."deploy:k3s"]
description = "部署已构建镜像到 K3s；仅限部署主机并需追加 sha-* 标签"
run = "bash scripts/deploy-k3s.sh"

[tasks.verify]
description = "跑单个最小模块，确认测试链路可用"
run = "python tests/run_tests.py unit --module discovery-service"

[tasks.doctor]
description = "打印当前工具链版本，便于排查环境不一致"
run = [
  "git --version",
  "java -version",
  "node --version",
  "cd travel-ui && corepack yarn --version",
  "python --version",
  "docker --version",
  "docker compose version",
]
